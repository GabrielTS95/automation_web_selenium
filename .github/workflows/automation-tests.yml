name: Web Automation Tests

on:
  workflow_dispatch:
    inputs:
      cucumber_tags:
        description: "Tags de Cucumber a ejecutar. Ejemplo: @CP001 o @LoginExitoso"
        required: false
        default: ""
  schedule:
    # Lunes 08:15 America/Lima.
    - cron: "15 8 * * 1"
      timezone: "America/Lima"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-tests:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      HEADLESS: true
      ALLURE_VERSION: 2.29.0
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CUCUMBER_TAGS: ${{ github.event.inputs.cucumber_tags || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run automation
        run: |
          if [ -n "$CUCUMBER_TAGS" ]; then
            mvn clean test -Dcucumber.filter.tags="$CUCUMBER_TAGS"
          else
            mvn clean test
          fi

      - name: Generate Allure report
        if: always()
        continue-on-error: true
        run: mvn allure:report -DskipTests

      - name: Install Allure CLI
        if: always()
        run: |
          curl -L -o allure.zip "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.zip"
          unzip -q allure.zip -d "$RUNNER_TEMP/allure"
          echo "$RUNNER_TEMP/allure/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Prepare Allure HTML folder
        if: always()
        run: |
          mkdir -p target/Reporte_Allure
          if [ -d target/allure-report ]; then
            cp -R target/allure-report/. target/Reporte_Allure/
          elif [ -d target/site/allure-maven-plugin ]; then
            cp -R target/site/allure-maven-plugin/. target/Reporte_Allure/
          fi

      - name: Generate single-file Allure report
        if: always()
        run: |
          allure generate --single-file target/allure-results -o target/Reporte_Allure_Local --clean

      - name: Upload Allure report for local opening
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reporte_Allure_Local
          path: target/Reporte_Allure_Local
          if-no-files-found: warn

      - name: Upload Allure HTML report for web server
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reporte_Allure_Web
          path: target/Reporte_Allure
          if-no-files-found: warn

      - name: Upload raw test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-test-results
          path: |
            target/surefire-reports
            target/allure-results
          if-no-files-found: ignore

      - name: Setup GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/Reporte_Allure

      - name: Deploy Allure report to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Package reports for email
        if: always()
        run: |
          mkdir -p target/email-artifacts
          if [ -d target/Reporte_Allure_Local ]; then
            (cd target/Reporte_Allure_Local && zip -qr ../email-artifacts/Reporte_Allure_Local.zip .)
          fi
          if [ -d target/surefire-reports ]; then
            (cd target && zip -qr email-artifacts/surefire-reports.zip surefire-reports)
          fi

      - name: Send email notification
        if: always()
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MAIL_TO: ergatosa.95@gmail.com,jarquinigoc@gmail.com
          RUN_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import mimetypes
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage
          from pathlib import Path

          required = ["SMTP_HOST", "SMTP_PORT", "SMTP_USERNAME", "SMTP_PASSWORD"]
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              print(f"Email notification skipped. Missing secrets: {', '.join(missing)}")
              raise SystemExit(0)

          status = os.getenv("RUN_STATUS", "unknown")
          repository = os.getenv("REPOSITORY", "")
          workflow = os.getenv("WORKFLOW_NAME", "")
          run_number = os.getenv("RUN_NUMBER", "")
          run_url = os.getenv("RUN_URL", "")
          pages_url = os.getenv("PAGES_URL", "")
          sender = os.getenv("SMTP_FROM") or os.getenv("SMTP_USERNAME")
          recipient = os.getenv("MAIL_TO")

          msg = EmailMessage()
          msg["From"] = sender
          msg["To"] = recipient
          msg["Subject"] = f"[{status.upper()}] {workflow} #{run_number} - {repository}"
          msg.set_content(
              "\n".join([
                  f"Workflow: {workflow}",
                  f"Repositorio: {repository}",
                  f"Ejecucion: #{run_number}",
                  f"Estado: {status}",
                  f"Detalle en GitHub Actions: {run_url}",
                  f"Reporte GitHub Pages: {pages_url or 'No disponible'}",
                  "",
                  "Se adjuntan los reportes disponibles.",
              ])
          )

          for path in Path("target/email-artifacts").glob("*.zip"):
              ctype, encoding = mimetypes.guess_type(path)
              if ctype is None or encoding is not None:
                  ctype = "application/zip"
              maintype, subtype = ctype.split("/", 1)
              msg.add_attachment(
                  path.read_bytes(),
                  maintype=maintype,
                  subtype=subtype,
                  filename=path.name,
              )

          host = os.environ["SMTP_HOST"]
          port = int(os.environ["SMTP_PORT"])
          username = os.environ["SMTP_USERNAME"]
          password = os.environ["SMTP_PASSWORD"]

          if port == 465:
              with smtplib.SMTP_SSL(host, port, context=ssl.create_default_context()) as smtp:
                  smtp.login(username, password)
                  smtp.send_message(msg)
          else:
              with smtplib.SMTP(host, port) as smtp:
                  smtp.starttls(context=ssl.create_default_context())
                  smtp.login(username, password)
                  smtp.send_message(msg)
          PY
